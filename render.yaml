services:
  - type: web
    name: stevolud-bot
    runtime: node
    plan: free
    buildCommand: npm install --prefix whatsapp-bot && npm ci --prefix telegram-bot
    startCommand: node telegram-bot/webhook-server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: LOCAL_LLM_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
